<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΩΩΩΩΩΩΩΩΩΩΩΩΩΩΩ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
</head>

<body>
    <audio autoplay loop>
        <source src="pou.mp3" type="audio/mpeg">
        
    </audio>
    <!-- Criando formulario-->

    <div class="col-4 m4">

        <h2> Fomulario BootStrap</h2>
        <form >
            <div class="mb-4">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email"class="form-control" id="email" aria-describedby="emailajuda" placeholder="Insira seu E-mail">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Senha:</label>
            
                <div class="input-group">
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Insira sua senha">
            
                    <button class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        
        <div class="col-8 m-4">
        
            <label for="title" 
            class="form-label"> Titulo do Post</label>
            <input
            class="form-control" 
            id="title" 
            name="title" 
            placeholder="Insira um título">
            
            
        
        </div>
        <div class="mb-4">

            <label for="content" class="form-label">Conteúdo</label>
            <textarea name="content" id="contentent" rows="5" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Publicar</button>

        <div class=" col-12 m-4">
            <h2> Teste de somente de leitura</h2>
            <div class="mb-4">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="Insira se email" value="matheus@gmail.com" readonly>
            </div>
        </div> 
    </form>
    <div class="col-8 m-4">
        <h2>Teste de input de arquivo</h2>
        <form>
            <div class="mb-4">
                <label for="foto"
                class="form-label">Apenas um arquivo</label>
                <input type="file" class="form-control" id="foto">
                <!-- No padrao HTML-->
                <input type="file"
                id="foto">
            </div>
            <div class="mb-4">
                <label for="foto" class="for-label">Multiplos arquivos</label>
                <input type="form-control" id="fotos" multiple>
            </div>
            <div class="mb-4">
                <label for="cidades" class="form-label">
                    Selecione a cidade
                </label>
                <input class="form-control" list="datalistOptions"id="Cidades"
                placeholder="Busque sua cidade">
                <datalist id="datalistOptions">
                    <option value="Fernandópolis"></option>
                    <option value="Meridiano"></option>
                    <option value="Pedranopolis"></option>

                </datalist>

            </div>

        </form>
    </div>
    </div>



















    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        
        togglePassword.addEventListener('click', function () {
        
            const type = password.getAttribute('type') === 'password'
                ? 'text'
                : 'password';
        
            password.setAttribute('type', type);
        
            const icon = this.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });
        </script>
</body>
</html>
