<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!-- Layouts com torm -->
        <div class="container col-6 mb-4">
            <h2>Cadastre-se preenchendo o formulário</h2>
            <form class="row g-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="email" placeholder="Insira seu e-mail">
                </div>
                <div class="col-md-6">
                    <label for="password" class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="password"
                    placeholder="Insira sua senha">
                 </div>
                 <div class="col-md-4">
                    <label for="cep" class="form-label">CEP: </label>
                    <input type="text" class="form-control" id="cep" placeholder="Insira o CEP">
                </div>
                <div class="col-md-10">
                    <label for="rua" class="form-label">Rua:</label>
                    <input type="text" class="form-control" id="rua" placeholder="Nome da rua">
                </div>
                <div class="col-md-2">
                    <label for="numero" class="form-label">Número: </label>
                    <input type="text" class="form-control" id="numero" placeholder="Número">
                </div>
                <div class="col-md-4">
                    <label for="cidade" class="form-label">Cidade:</label>
                    <input type="text" class="form-control" id="cidade">
                </div>
                <div class="col-md-4">
                    <label for="Estado" class="form-label">Estado:</label>
                    <select name="estado" id="estado" class="form-select">
                        <option selected>Escolha</option>
                        <option value="1">São Paulo</option>
                        <option value="2">Rio de Janeiro</option>
                        <option value="3">Minas Gerais</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="newsletter">
                        <label for="newsletter" class="form-check-label">Receber Newsletter?</label>
                    </div>
                </div>
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </div>
    </body>
</html>
