<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet"integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"crossorigin="anonymous">
    <title>Login</title>
</head>
<body>
    <audio autoplay loop>
        <source src="Monster.mp3" type="audio/mpeg">
    </audio>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Bem-vindo!</h2>
                    <p class="text-muted">Faça login para continuar</p>
                </div>
                <form class="row g-4">
                    <div class="col-12">
                        <label for="email" class="form-label fw-semibold">
                            E-mail:
                        </label>
                        <input type="email"class="form-control form-control-lg" id="email" placeholder="Insira seu e-mail" required>
                    </div>
                    <div class="col-12">
                        <label for="password" class="form-label fw-semibold">
                            Senha:
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Insira sua senha" required>
                    </div>
                    <div class="col-12">
                        <button type="submit"
                            class="btn btn-primary btn-lg w-100">
                            Entrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    
</body>
</html>
