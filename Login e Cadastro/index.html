<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    
    <title>Formulario de Cadastro</title>
</head>
<body>
    <audio autoplay loop>
        <source src="pou.mp3" type="audio/mpeg">
        
    </audio>
    <div class="container col-6 mb-4">
        <h2>Cadastre-se preenchendo o formulário</h2>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" class="form-control" id="email" placeholder="Insira seu e-mail">
            </div>
            <div class="col-md-6">
                <label for="password" class="form-label">Senha:</label>
                <input type="password" class="form-control" id="password"
                placeholder="Insira sua senha">
             </div>
                <!-- Campo CEP -->
                <div class="col-md-6">
                  <label for="cep" class="form-label">CEP:</label>
                  <input type="text" class="form-control" id="cep" maxlength="9" placeholder="00000-000">
                </div>
              
                <!-- Campo Rua (Preenchido automaticamente) -->
                <div class="col-md-6">
                  <label for="rua" class="form-label">Rua / Logradouro:</label>
                  <input type="text" class="form-control" id="rua" placeholder="Rua, Avenida, etc.">
                </div>
              
                <!-- Campo Bairro (Preenchido automaticamente) -->
                <div class="col-md-6">
                  <label for="bairro" class="form-label">Bairro:</label>
                  <input type="text" class="form-control" id="bairro" placeholder="Bairro">
                </div>
              
                <!-- Campo Cidade (Preenchido automaticamente) -->
                <div class="col-md-6">
                  <label for="cidade" class="form-label">Cidade:</label>
                  <input type="text" class="form-control" id="cidade" placeholder="Cidade">
                </div>
              
                <!-- Campo Estado (Preenchido automaticamente) -->
                <div class="col-md-6">
                  <label for="uf" class="form-label">Estado:</label>
                  <input type="text" class="form-control" id="uf" placeholder="UF">
                </div>
              
            
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="newsletter">
                    <label for="newsletter" class="form-check-label">Receber Newsletter?</label>
                </div>
            </div>
            <div class="col-12 text-center">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
        </form>
        <script>

            function buscarCep() {
                var cep = document.getElementById("cep").value;
                cep = cep.replace("-", "");
    
                if (cep.length == 8) {
    
                    fetch("https://viacep.com.br/ws/" + cep + "/json/")
                        .then(function (resposta) {
                            return resposta.json();
    
                        })
                        .then(function (dados) {
                            document.getElementById("endereco").value = dados.logradouro;
                            document.getElementById("bairro").value = dados.bairro;
                            document.getElementById("cidade").value = dados.localidade;
                            document.getElementById("estado").value = dados.uf;
    
                        });
                } else {
                    alert("Digite um CEP válido");
    
                }
            }
        </script>
    </div>
</body>
</html>
