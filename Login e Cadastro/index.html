<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <title>Formulário de Cadastro</title>
</head>

<body>

    <audio autoplay loop>
        <source src="Monster.mp3" type="audio/mpeg">
    </audio>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow-lg border-0 rounded-4 p-4"
            style="max-width: 700px; width: 100%;">

            <div class="card-body">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">Crie sua conta</h2>
                    <p class="text-muted">Preencha o formulário para se cadastrar</p>
                </div>

                <form class="row g-3">
                    <!-- E-mail -->
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">
                            E-mail:
                        </label>
                        <input type="email"
                            class="form-control"
                            id="email"
                            placeholder="Insira seu e-mail"
                            required>
                    </div>
                    <!-- Senha -->
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">
                            Senha:
                        </label>
                        <input type="password"
                            class="form-control"
                            id="password"
                            placeholder="Insira sua senha"
                            required>
                    </div>
                    <!-- CEP -->
                    <div class="col-md-6">
                        <label for="cep" class="form-label fw-semibold">
                            CEP:
                        </label>
                        <input type="text"
                            class="form-control"
                            id="cep"
                            maxlength="9"
                            placeholder="00000-000">
                    </div>
                    <!-- Rua -->
                    <div class="col-md-6">
                        <label for="rua" class="form-label fw-semibold">
                            Rua / Logradouro:
                        </label>
                        <input type="text"
                            class="form-control"
                            id="rua"
                            placeholder="Rua, Avenida, etc.">
                    </div>
                    <!-- Bairro -->
                    <div class="col-md-6">
                        <label for="bairro" class="form-label fw-semibold">
                            Bairro:
                        </label>
                        <input type="text"
                            class="form-control"
                            id="bairro"
                            placeholder="Bairro">
                    </div>
                    <!-- Cidade -->
                    <div class="col-md-6">
                        <label for="cidade" class="form-label fw-semibold">
                            Cidade:
                        </label>
                        <input type="text"
                            class="form-control"
                            id="cidade"
                            placeholder="Cidade">
                    </div>
                    <!-- Estado -->
                    <div class="col-md-6">
                        <label for="uf" class="form-label fw-semibold">
                            Estado:
                        </label>
                        <input type="text"
                            class="form-control"
                            id="uf"
                            placeholder="UF">
                    </div>
                    <!-- Newsletter -->
                    <div class="col-12">
                        <div class="form-check">
                            <input type="checkbox"
                                class="form-check-input"
                                id="newsletter">

                            <label for="newsletter" class="form-check-label">
                                Receber Newsletter?
                            </label>
                        </div>
                    </div>
                    <!-- Botão -->
                    <div class="col-12">
                        <button type="button"
                            class="btn btn-primary btn-lg w-100"
                            onclick="window.location.href='login.html'">
                            Cadastrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script>

        document.getElementById("cep").addEventListener("blur", function () {

            let cep = this.value.replace(/\D/g, "");

            if (cep.length !== 8) {
                alert("Digite um CEP válido.");
                return;
            }

            fetch(`https://viacep.com.br/ws/${cep}/json/`)

                .then(response => response.json())

                .then(data => {

                    if (data.erro) {
                        alert("CEP não encontrado.");
                        return;
                    }

                    document.getElementById("rua").value =
                        data.logradouro || "";

                    document.getElementById("bairro").value =
                        data.bairro || "";

                    document.getElementById("cidade").value =
                        data.localidade || "";

                    document.getElementById("uf").value =
                        data.uf || "";

                })

                .catch(error => {

                    console.error("Erro ao consultar o CEP:", error);

                    alert("Não foi possível consultar o CEP.");

                });

        });

    </script>

</body>

</html>
